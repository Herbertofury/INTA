[package]
name = "inta-diagnostic-handoff"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10.3"
getrandom = "0.2"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Storage_FileSystem","Win32_System_SystemInformation","Win32_System_Power","Win32_System_Console"]}

[profile.release]
strip=true
lto="thin"
