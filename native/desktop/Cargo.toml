[package]
name = "inta-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
inta-optics = { path = "../optics" }
rfd = { version = "=0.17.2", default-features = false }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
strip = true
