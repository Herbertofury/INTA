[package]
name = "inta-vm-lab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = {version="1", features=["derive"]}
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = {version="1", features=["v4"]}

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Security","Win32_Storage_FileSystem","Win32_System_Threading","Win32_System_SystemInformation","Win32_System_JobObjects","Win32_System_LibraryLoader","Win32_System_Console"]}
