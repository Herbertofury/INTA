name: Verify the unified Windows desktop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'desktop/**'
      - 'agent/**'
      - 'data/**'
      - 'docs/**'
      - 'wiki/**'
      - 'site/**'
      - 'media/**'
      - 'assets/**'
      - 'scripts/release_artwork.py'
      - 'scripts/brand_markdown.py'
      - '.github/workflows/inta-desktop-release.yml'
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build a signed fixture and exercise the entire package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=INTA disposable build test' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable
          $out = Join-Path $env:RUNNER_TEMP 'inta-release'
          native/release/release.ps1 -OutputDirectory $out -Thumbprint $cert.Thumbprint -MsiPythonVersion 3.12
          $copy = Join-Path $env:RUNNER_TEMP 'inta-portable'
          Expand-Archive -LiteralPath (Join-Path $out 'INTA-Desktop-portable-x64.zip') -DestinationPath $copy
          $manifest = Get-Content (Join-Path $copy 'base/manifest.json') -Raw | ConvertFrom-Json
          & (Join-Path $copy 'INTA Verify.exe') (Join-Path $copy 'base') $manifest.sourceDigest
          if ($LASTEXITCODE) { throw 'Extracted payload failed verification' }
          $env:INTA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'inta-case-fixture'
          native/release/verify-workspace.ps1 -Executable (Join-Path $copy 'base/inta-desktop.exe')
          $package = Join-Path $out 'INTA-Desktop-x64.msi'
          $install = Start-Process msiexec.exe -WindowStyle Hidden -ArgumentList "/i `"$package`" /qn /norestart" -PassThru -Wait
          if ($install.ExitCode) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $app = Join-Path $env:LOCALAPPDATA 'Programs/INTA Desktop'
            $result = & (Join-Path $app 'inta.exe') capabilities | ConvertFrom-Json
            if (!$result.ok) { throw 'Installed capability discovery failed' }
          } finally {
            $uninstall = Start-Process msiexec.exe -WindowStyle Hidden -ArgumentList "/x `"$package`" /qn /norestart" -PassThru -Wait
            if ($uninstall.ExitCode) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
