name: Build and boot INTA Rescue
on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'media/inta_brand_ui.py'
      - 'media/inta_optics_ui.py'
      - 'native/optics/**'
      - 'data/brand-icons.json'
      - 'assets/brand-icons/**'
      - 'assets/inta-brand/**'
      - 'docs/assets/inta-mark.svg'
      - 'scripts/build-iso'
      - 'scripts/build-rescue-wallpaper.py'
      - 'scripts/smoke-iso'
      - 'scripts/rescue_boot_log.py'
  workflow_dispatch:
  schedule:
    - cron: '39 9 * * 2'

concurrency:
  group: inta-rescue-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate source
        run: python3 -m unittest discover -s tests && bash -n scripts/build-iso && bash -n scripts/smoke-iso
      - name: Build with Debian stable and current signed security updates
        run: |
          docker run --rm --privileged -v "${GITHUB_WORKSPACE}:/src:ro" -v "${RUNNER_TEMP}:/out" debian:13-slim bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap debian-archive-keyring ca-certificates rustc gcc libc6-dev python3
            /src/scripts/build-iso /out/inta-dist
          '
          cat "${RUNNER_TEMP}/inta-dist/SHA256SUMS"
      - name: Package complete portable Media Creator
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/inta-dist"
          python3 scripts/package-media.py --output "${RUNNER_TEMP}/inta-dist/INTA-Media-Creator.pyz"
          (cd "${RUNNER_TEMP}/inta-dist" && sha256sum INTA-Media-Creator.pyz >> SHA256SUMS)
      - name: Store candidate image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inta-rescue-amd64
          path: ${{ runner.temp }}/inta-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Verify BIOS and UEFI boot to XFCE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          iso="${RUNNER_TEMP}/inta-dist/inta-rescue-amd64.iso"
          scripts/smoke-iso "$iso" bios "${RUNNER_TEMP}/inta-diagnostics"
          scripts/smoke-iso "$iso" uefi "${RUNNER_TEMP}/inta-diagnostics"
      - name: Prepare size-safe verified release assets
        run: |
          python3 - "$RUNNER_TEMP/inta-dist/SHA256SUMS" "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import re
          import sys
          matches = [match[1] for line in Path(sys.argv[1]).read_text(encoding="ascii").splitlines()
                     if (match := re.fullmatch(r"([0-9a-f]{64}) [ *]inta-rescue-amd64\.iso", line))]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one original ISO checksum")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as environment:
              environment.write(f"ORIGINAL_ISO_SHA256={matches[0]}\n")
          PY
          python3 scripts/package-rescue-release.py \
            --input-dir "$RUNNER_TEMP/inta-dist" --output-dir "$RUNNER_TEMP/inta-release"
      - name: Verify prepared downloads through Media Creator
        env:
          RELEASE_DIR: ${{ runner.temp }}/inta-release
        run: |
          python3 tests/test_media_parts.py --parts-dir "$RELEASE_DIR" \
            --expected-sha256 "$ORIGINAL_ISO_SHA256"
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inta-boot-diagnostics
          path: ${{ runner.temp }}/inta-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Require an exact reviewed scanner in the verified ISO
        run: |
          test -f .github/rescue-scanner-review.json || {
            echo "::error::Scanner review not present. Keep this boot-verified image as a candidate only."
            exit 1
          }
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          python3 scripts/check-rescue-image-scanner.py \
            --iso "$RUNNER_TEMP/inta-dist/inta-rescue-amd64.iso" \
            --expected-sha256 "$ORIGINAL_ISO_SHA256" \
            --review .github/rescue-scanner-review.json
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/inta-release-notes.md"
          python3 - "$notes" <<'PY'
          import os
          from pathlib import Path
          import sys
          source = os.environ["GITHUB_SHA"]
          digest = os.environ["ORIGINAL_ISO_SHA256"]
          repository = os.environ["GH_REPO"]
          download = f"https://github.com/{repository}/releases/latest"
          icon = f"https://raw.githubusercontent.com/{repository}/main/docs/assets/inta-mark.svg"
          creator = (f'<a href="{download}"><img src="{icon}" alt="INTA Media Creator" '
                     f'width="18" height="18"></a> [INTA Media Creator]({download})')
          Path(sys.argv[1]).write_text(
              f"ISO and portable app built from `{source}`. The complete ISO passed offline "
              "BIOS and UEFI desktop and application checks. Prepared release downloads "
              "were reconstructed and checked against the original image checksum.\n\n"
              f"Use the included {creator} and choose **Download / update ISO**. "
              "It downloads a normal ISO or automatically assembles numbered pieces, "
              "verifies the complete image and saves `inta-rescue-amd64.iso`. "
              "All ISO contents are preserved. Keep `SHA256SUMS` beside the completed image.\n\n"
              f"Original ISO SHA-256: `{digest}`.\n", encoding="utf-8")
          PY
          tag="rescue-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$RUNNER_TEMP"/inta-release/* --target "$GITHUB_SHA" --draft \
            --title "INTA Rescue $(date -u +%F)" --notes-file "$notes"
          gh release edit "$tag" --draft=false --latest
    permissions:
      contents: write
