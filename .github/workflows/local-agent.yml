name: Build INTA Local Maintenance Agent
on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths:
      - 'agent/**'
      - '.github/workflows/local-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/local-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inta-local-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: osx-arm64
          - runner: ubuntu-24.04
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and compile
        run: |
          dotnet restore agent/INTA.LocalAgent/INTA.LocalAgent.csproj
          dotnet build agent/INTA.LocalAgent/INTA.LocalAgent.csproj -c Release --no-restore
      - name: Exercise read-only storage preview
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        run: python agent/storage_preview_test.py agent/INTA.LocalAgent/bin/Release/net10.0/inta-agent.dll -v
      - name: Publish self-contained single-file agent
        run: dotnet publish agent/INTA.LocalAgent/INTA.LocalAgent.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package release archive
        run: python agent/package.py publish dist/inta-agent-${{ matrix.rid }}.zip
      - name: Include Windows installer helper
        if: matrix.rid == 'win-x64'
        run: cp agent/install-agent.ps1 dist/install-agent.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: inta-agent-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: inta-agent-*
          path: dist
          merge-multiple: true
      - name: Include Windows installer helper and generate SHA-256 checksums
        run: |
          cp agent/install-agent.ps1 dist/install-agent.ps1
          cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "INTA Local Agent $GITHUB_REF_NAME" --notes-file agent/RELEASE-NOTES.md
