name: Build INTA Rust Local Maintenance Agent
on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths:
      - 'crates/inta-agent/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'agent/**'
      - '.github/workflows/local-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inta-local-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            binary: inta-agent.exe
          - runner: ubuntu-24.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            binary: inta-agent
          - runner: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            binary: inta-agent
          - runner: macos-latest
            rid: osx-x64
            target: x86_64-apple-darwin
            binary: inta-agent
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test native agent contracts
        run: cargo test --locked -p inta-agent
      - name: Build native executable
        run: cargo build --locked --release -p inta-agent --target ${{ matrix.target }} --bin inta-agent
      - name: Package archive and SHA-256 sidecar in Rust
        run: |
          mkdir -p publish
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} publish/
          cp agent/README.md publish/README.md
          cp agent/RELEASE-NOTES.md publish/RELEASE-NOTES.md
          cargo run --locked --release -p inta-agent --bin inta-agent-package -- publish dist/inta-agent-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: inta-agent-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: inta-agent-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "INTA Rust Local Agent $GITHUB_REF_NAME" --notes-file agent/RELEASE-NOTES.md
