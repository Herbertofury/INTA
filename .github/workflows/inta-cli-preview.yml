name: Verify INTA command-line control
on:
  pull_request:
    paths:
      - .github/workflows/inta-cli-preview.yml
      - agent/INTA.LocalAgent/**
      - data/tool-cli-coverage.json
      - data/tools.json
      - scripts/check-tool-cli.py
      - scripts/cli-anything-inta.py
      - scripts/stage-rclone-preview.py
      - tests/test_cli_anything_inta.py
      - tests/verify_cli_storage_preview.py
      - tests/verify_cli_rclone_local.py
      - tests/test_tool_cli_coverage.py
permissions:
  contents: read
jobs:
  windows-power-harness:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check catalog coverage and CLI rejection behavior
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_cli_anything_inta.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_tool_cli_coverage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/check-tool-cli.py
          exit $LASTEXITCODE
      - name: Publish the genuine local agent as a pinned single-file package
        shell: pwsh
        run: |
          dotnet publish agent/INTA.LocalAgent/INTA.LocalAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o cli-native
          exit $LASTEXITCODE
      - name: Independently verify the read-only Windows result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-PowerIds([string] $Flag) {
              $tool = Join-Path $env:SystemRoot 'System32\powercfg.exe'
              $text = (& $tool $Flag) -join "`n"
              if ($LASTEXITCODE -ne 0) { throw "Native powercfg query failed" }
              $pattern = '(?i)\b[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\b'
              @([regex]::Matches($text, $pattern) | ForEach-Object { $_.Value.ToLowerInvariant() } | Sort-Object -Unique)
          }
          $before = @(Read-PowerIds '/getactivescheme')
          $registered = @(Read-PowerIds '/list')
          if ($before.Length -ne 1 -or $before[0] -notin $registered) { throw 'The runner exposed no coherent power inventory' }
          $agent = (Resolve-Path 'cli-native/inta-agent.exe').Path
          $pin = (Get-FileHash -Algorithm SHA256 $agent).Hash.ToLowerInvariant()
          $wrong = '0' * 64
          $refused = python -B scripts/cli-anything-inta.py --json power-plans --agent-binary $agent --agent-sha256 $wrong
          if ($LASTEXITCODE -ne 2 -or ($refused | ConvertFrom-Json).status -ne 'refused') { throw 'Wrong executable pin was accepted' }
          $raw = python -B scripts/cli-anything-inta.py --json power-plans --agent-binary $agent --agent-sha256 $pin
          if ($LASTEXITCODE -ne 0) { throw 'Native harness failed' }
          $snapshot = $raw | ConvertFrom-Json
          $after = @(Read-PowerIds '/getactivescheme')
          if ($snapshot.operation -ne 'power-plans' -or $snapshot.status -ne 'ready' -or $snapshot.activeId -ne $before[0] -or
              $after.Length -ne 1 -or $after[0] -ne $before[0] -or
              @(Compare-Object $registered @($snapshot.plans.id | Sort-Object -Unique)).Length -ne 0) {
              throw 'Harness does not match the independent Windows inventory or changed the active plan'
          }
          $facts = @{ operation = 'power-plans'; platform = 'windows-x64'; passed = $true; version = '0.1.0'; agentSha256 = $pin; sourceCommit = $env:GITHUB_SHA }
          $facts | ConvertTo-Json | Set-Content -Encoding utf8 cli-harness-proof.json
          $facts | ConvertTo-Json -Compress
      - name: Verify the startup harness against a disposable Windows registry fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = (Resolve-Path 'cli-native/inta-agent.exe').Path
          $pin = (Get-FileHash -Algorithm SHA256 $agent).Hash.ToLowerInvariant()
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          $tag = 'INTA_CLI_CI_' + [Guid]::NewGuid().ToString('N')
          $marker = 'SYNTHETIC_VALUE_MUST_NOT_LEAVE_THE_REGISTRY'
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Software\Microsoft\Windows\CurrentVersion\RunOnce')
          $fixtureWritten = $false
          try {
              if ($null -ne $key.GetValue($tag)) { throw 'Fixture name already exists' }
              $key.SetValue($tag, $marker, [Microsoft.Win32.RegistryValueKind]::String)
              $fixtureWritten = $true
              $before = $key.GetValue($tag)
              $raw = python -B scripts/cli-anything-inta.py --json startup-inventory --agent-binary $agent --agent-sha256 $pin
              if ($LASTEXITCODE -ne 0 -or ($raw -join "`n").Contains($marker)) { throw 'Startup harness failed or disclosed a registry value' }
              $snapshot = $raw | ConvertFrom-Json
              $matches = @($snapshot.sources | Where-Object { $_.scope -eq 'current-user' -and $_.view -eq 'shared' -and $_.key -eq 'RunOnce' -and $_.entryNames -contains $tag })
              if ($snapshot.operation -ne 'startup-inventory' -or $snapshot.status -ne 'ready' -or $snapshot.argumentsCollected -or
                  $matches.Length -ne 1 -or $before -ne $marker -or $key.GetValue($tag) -ne $before) {
                  throw 'Startup harness did not match independent read-only fixture evidence'
              }
              @{ operation = 'startup-inventory'; platform = 'windows-x64'; passed = $true; version = '0.1.0'; agentSha256 = $pin; sourceCommit = $env:GITHUB_SHA } |
                  ConvertTo-Json | Set-Content -Encoding utf8 cli-startup-proof.json
          } finally {
              if ($fixtureWritten) { $key.DeleteValue($tag, $false) }
              $key.Dispose()
          }
      - name: Verify opted-in Windows startup folder metadata without resolving shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = (Resolve-Path 'cli-native/inta-agent.exe').Path
          $pin = (Get-FileHash -Algorithm SHA256 $agent).Hash.ToLowerInvariant()
          function Independent-Names([System.Environment+SpecialFolder] $Folder) {
              $path = [System.Environment]::GetFolderPath($Folder)
              if (-not $path -or -not (Test-Path -LiteralPath $path -PathType Container)) { return @() }
              @(Get-ChildItem -LiteralPath $path -Force | ForEach-Object Name | Sort-Object -CaseSensitive)
          }
          $userBefore = @(Independent-Names Startup)
          $allBefore = @(Independent-Names CommonStartup)
          $raw = python -B scripts/cli-anything-inta.py --json startup-inventory --include-folders --agent-binary $agent --agent-sha256 $pin
          if ($LASTEXITCODE -ne 0) { throw 'Startup folder harness did not return a complete inventory' }
          $result = $raw | ConvertFrom-Json
          if ($result.schema -ne 2 -or $result.startupSettingsUri -ne 'ms-settings:startupapps' -or $result.argumentsCollected -or
              $result.startupFolders.Count -ne 2) { throw 'Startup folder response does not match the expected scope' }
          $user = @($result.startupFolders | Where-Object scope -eq 'current-user')[0]
          $all = @($result.startupFolders | Where-Object scope -eq 'all-users')[0]
          $userAfter = @(Independent-Names Startup)
          $allAfter = @(Independent-Names CommonStartup)
          if (($user.status -ne 'read' -and $userBefore.Count -ne 0) -or ($all.status -ne 'read' -and $allBefore.Count -ne 0) -or
              (ConvertTo-Json -InputObject $userBefore -Compress) -cne (ConvertTo-Json -InputObject @($user.entryNames | Sort-Object -CaseSensitive) -Compress) -or
              (ConvertTo-Json -InputObject $allBefore -Compress) -cne (ConvertTo-Json -InputObject @($all.entryNames | Sort-Object -CaseSensitive) -Compress) -or
              (ConvertTo-Json -InputObject $userBefore -Compress) -cne (ConvertTo-Json -InputObject $userAfter -Compress) -or
              (ConvertTo-Json -InputObject $allBefore -Compress) -cne (ConvertTo-Json -InputObject $allAfter -Compress)) {
              throw 'Startup folder evidence did not match or the snapshot changed'
          }
          @{ operation = 'startup-inventory-include-folders'; platform = 'windows-x64'; passed = $true; agentSha256 = $pin; sourceCommit = $env:GITHUB_SHA } |
              ConvertTo-Json | Set-Content -Encoding utf8 cli-startup-folders-proof.json
      - name: Verify desktop program metadata without exposing uninstall commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          $agent = (Resolve-Path 'cli-native/inta-agent.exe').Path
          $pin = (Get-FileHash -Algorithm SHA256 $agent).Hash.ToLowerInvariant()
          $id = 'INTA_CLI_App_' + [Guid]::NewGuid().ToString('N')
          $base = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Software\Microsoft\Windows\CurrentVersion\Uninstall')
          $app = $null
          try {
              if ($id -in $base.GetSubKeyNames()) { throw 'Fixture name already exists' }
              $app = $base.CreateSubKey($id)
              $name = 'INTA synthetic program display'
              $marker = 'SYNTHETIC_UNINSTALL_VALUE_DO_NOT_READ_OR_RUN'
              $app.SetValue('DisplayName', $name)
              $app.SetValue('DisplayVersion', '9.8.7')
              $app.SetValue('Publisher', 'Synthetic publisher')
              $app.SetValue('UninstallString', $marker)
              $raw = python -B scripts/cli-anything-inta.py --json installed-programs --agent-binary $agent --agent-sha256 $pin
              if ($LASTEXITCODE -ne 0 -or ($raw -join "`n").Contains($marker) -or ($raw -join "`n").Contains($id)) { throw 'Program harness failed or disclosed an internal registration field' }
              $snapshot = $raw | ConvertFrom-Json
              $matches = @($snapshot.rows | Where-Object { $_.scope -eq 'Current user' -and $_.name -eq $name -and $_.version -eq '9.8.7' -and $_.publisher -eq 'Synthetic publisher' })
              if ($snapshot.operation -ne 'installed-programs' -or $snapshot.status -ne 'ready' -or $snapshot.commandsCollected -or
                  $matches.Length -ne 1 -or $app.GetValue('UninstallString') -ne $marker) { throw 'Program metadata proof did not match the fixture' }
              @{ operation = 'installed-programs'; platform = 'windows-x64'; passed = $true; version = '0.1.0'; agentSha256 = $pin; sourceCommit = $env:GITHUB_SHA } |
                  ConvertTo-Json | Set-Content -Encoding utf8 cli-programs-proof.json
          } finally {
              if ($null -ne $app) { $app.Dispose(); $base.DeleteSubKeyTree($id, $false) }
              $base.Dispose()
          }
      - name: Match native storage totals and preserve the disposable folder
        shell: pwsh
        run: |
          $proof = python -B tests/verify_cli_storage_preview.py cli-native/inta-agent.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $proof | Set-Content -Encoding utf8 cli-storage-proof.json
          $proof
      - uses: actions/upload-artifact@v4
        with:
          name: inta-power-plans-cli-test-preview
          retention-days: 7
          path: |
            cli-harness-proof.json
            cli-startup-proof.json
            cli-startup-folders-proof.json
            cli-programs-proof.json
            cli-storage-proof.json
            cli-native/inta-agent.exe
          if-no-files-found: error
  publisher-rclone-hash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stage the publisher-checksummed rclone archive without installation
        run: python -B scripts/stage-rclone-preview.py cli-rclone-publisher
      - name: Compare actual rclone output and verify the local fixture is unchanged
        run: python -B tests/verify_cli_rclone_local.py cli-rclone-publisher/rclone${{ runner.os == 'Windows' && '.exe' || '' }}
