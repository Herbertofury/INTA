name: Verify INTA Android preview

on:
  pull_request:
    paths:
      - mobile/android/**
      - native/optics/**
      - .github/workflows/inta-mobile-preview.yml
  workflow_dispatch:
    inputs:
      owner_apk_tag:
        description: Optional INTA Mobile release tag to install on the test emulator
        required: false
        type: string
      owner_apk_sha256:
        description: Expected SHA-256 of the owner-signed release APK
        required: false
        type: string

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare isolated official Android tools and AVD
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          mkdir -p "$RUNNER_TEMP/inta-avd" "$RUNNER_TEMP/inta-android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/inta-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/inta-android-user"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)
          fi
          test -x "$sdk_manager"
          avd_manager="$(dirname "$sdk_manager")/avdmanager"
          test -x "$avd_manager"
          "$sdk_manager" --install 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;default;x86_64' 'emulator'
          mode=off
          if [[ -c /dev/kvm ]]; then
            # Give only this job's runner access to the GitHub-hosted VM's KVM device.
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              sudo chown "$(id -u):$(id -g)" /dev/kvm
              sudo chmod u+rw /dev/kvm
            fi
            if "$ANDROID_HOME/emulator/emulator" -accel-check; then mode=on; fi
          fi
          printf 'Android emulator acceleration: %s\n' "$mode"
          printf 'INTA_ANDROID_EMULATOR_ACCEL=%s\n' "$mode" >> "$GITHUB_ENV"
          printf 'no\n' | "$avd_manager" create avd -n inta-test-ci -k 'system-images;android-36;default;x86_64'
          {
            printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
            printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME"
            printf 'ANDROID_USER_HOME=%s\n' "$ANDROID_USER_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Fetch the selected owner-signed package
        if: inputs.owner_apk_tag != '' || inputs.owner_apk_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.owner_apk_tag }}
          DIGEST: ${{ inputs.owner_apk_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^mobile-[0-9][a-zA-Z0-9.-]{0,48}$ && "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
          gh release download "$TAG" --pattern INTA-Mobile-Android.apk --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          printf '%s  INTA-Mobile-Android.apk\n' "$DIGEST" | sha256sum --check
          printf 'INTA_OWNER_SIGNED_APK=%s/INTA-Mobile-Android.apk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'INTA_OWNER_VERSION=%s\n' "${TAG#mobile-}" >> "$GITHUB_ENV"
          if [[ "$TAG" != mobile-0.2-preview.1 ]]; then
            prior=mobile-0.2-preview.2
            prior_sha=4f3d0984f1745beee10043c33af2a037d8c876ffada022a7bf076daa84b93a0b
            if [[ "$TAG" == "$prior" ]]; then
              prior=mobile-0.2-preview.1
              prior_sha=74cd9e5aa37dee61104f9a43a89c4815bb8647af64ab6c3e4eec9607ef112e63
            fi
            mkdir "$RUNNER_TEMP/prior-mobile"
            gh release download "$prior" --repo "$GITHUB_REPOSITORY" --pattern INTA-Mobile-Android.apk --dir "$RUNNER_TEMP/prior-mobile"
            printf '%s  %s\n' "$prior_sha" "$RUNNER_TEMP/prior-mobile/INTA-Mobile-Android.apk" | sha256sum --check
            printf 'INTA_PRIOR_TAG=%s\n' "$prior" >> "$GITHUB_ENV"
            printf 'INTA_PRIOR_SIGNED_APK=%s/prior-mobile/INTA-Mobile-Android.apk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
      - name: Build and exercise native timer, restart and checklist
        run: |
          bash mobile/android/verify-emulator.sh "$ANDROID_HOME/platforms/android-36/android.jar" \
            "$ANDROID_HOME/build-tools/36.0.0" "$ANDROID_HOME/platform-tools/adb" inta-test-ci mobile-proof
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inta-mobile-android-preview-unsigned
          path: |
            mobile-proof/inta-mobile-unsigned.apk
            mobile-proof/inta-job-completed.png
            mobile-proof/build.log
            mobile-proof/optics.log
            mobile-proof/start.log
            mobile-proof/resume.log
            mobile-proof/verify-completed.log
            mobile-proof/draft.log
            mobile-proof/draft-verify.log
            mobile-proof/invoice.log
            mobile-proof/invoice-verify.log
            mobile-proof/handoff.log
            mobile-proof/diagnostic-import.log
            mobile-proof/jobs-*.log
            mobile-proof/SHA256SUMS
            mobile-proof/disposable-signing-proof.txt
            mobile-proof/owner-install.txt
          if-no-files-found: error
