[package]
name = "inta-rescue"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"
description = "Native Rust recovery workspace for INTA Rescue"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "0.15"
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
serde_json = "1"

[[bin]]
name = "inta-rescue"
path = "src/main.rs"
