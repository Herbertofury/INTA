[package]
name = "inta-media"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust verified Rescue ISO downloader and Ventoy media assistant"

[dependencies]
inta-rescue = { path = "../inta-rescue" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
ureq = { version = "2.12", features = ["json"] }
url = "2"
[target.'cfg(windows)'.dependencies]
open = "5"

[[bin]]
name = "inta-media"
path = "src/main.rs"
