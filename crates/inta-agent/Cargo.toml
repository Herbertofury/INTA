[package]
name = "inta-agent"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust local maintenance bridge and portable host for INTA"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Com_StructuredStorage"] }

[[bin]]
name = "inta-agent"
path = "src/main.rs"

[[bin]]
name = "inta-agent-package"
path = "src/package.rs"
