[package]
name = "inta-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
aho-corasick = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlAnchorElement", "Node", "NodeList", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "Storage", "StorageEvent", "Location", "History", "DomTokenList", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "Request", "RequestInit", "RequestMode", "RequestCache", "RequestCredentials", "Response", "Headers", "HtmlCollection", "DocumentFragment", "FocusEvent", "CssStyleDeclaration", "ServiceWorkerContainer", "ServiceWorkerRegistration", "console"] }

