[package]
name = "inta-release"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust publication, source recovery and provenance gates for INTA"

[dependencies]
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "inta-release"
path = "src/main.rs"
