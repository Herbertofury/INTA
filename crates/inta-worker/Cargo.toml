[package]
name = "inta-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["ServiceWorkerGlobalScope", "WorkerGlobalScope", "Event", "EventTarget", "ExtendableEvent", "FetchEvent", "Request", "RequestMode", "Response", "ResponseInit", "Headers", "Cache", "CacheStorage", "WorkerLocation", "Url", "Clients"] }
