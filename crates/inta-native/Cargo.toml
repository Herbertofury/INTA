[package]
name = "inta-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "inta-desktop"
path = "src/main.rs"

[dependencies]
inta-ui = { path = "../inta-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
log = "0.4"

[package.metadata.android]
package = "org.inta.toolbox"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "INTA Mobile"
theme = "@android:style/Theme.Material.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
