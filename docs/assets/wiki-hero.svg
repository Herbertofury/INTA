<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">INTA Service Atlas</title>
  <desc id="desc">A shared field guide for the people who keep computers working. Find the right path. Leave a better one.</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#081319"/><stop offset="1" stop-color="#102a31"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#22d3b5" stop-opacity=".15"/><stop offset="1" stop-color="#22d3b5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d1fae5" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1440" height="360" rx="18" fill="url(#base)"/>
  <rect width="1440" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="1115" cy="170" rx="370" ry="270" fill="url(#glow)"/>
  <path d="M0 0H1440" stroke="#5eead4" stroke-width="4"/>
