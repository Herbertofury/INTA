    <rect x="1196" y="123" width="38" height="38" rx="10" fill="#123139"/>
    <circle cx="1242" cy="218" r="24" fill="#123139"/>
    <rect x="1128" y="254" width="44" height="44" rx="12" fill="#123139"/>
    <path d="M958 92L966 100L982 84M1230 218L1238 226L1254 210M1140 276L1147 283L1160 270" stroke="#b6ffdc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1102 142H1118M1110 134V150M1207 142H1223" stroke="#b6ffdc" stroke-linecap="round"/>
