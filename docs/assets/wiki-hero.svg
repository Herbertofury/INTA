    <path d="M69 57H90M79.5 57V78M69 78H90" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="64" fill="#99f6e4" font-size="15" font-weight="700" letter-spacing="3">INTA COMPUTER SERVICES</text>
    <text x="120" y="85" fill="#8ca9ad" font-size="12" letter-spacing="2">THE SHARED TECHNICIAN FIELD GUIDE</text>
    <text x="56" y="166" fill="#f0fdfa" font-size="60" font-weight="700" letter-spacing="-2">Service Atlas</text>
    <text x="58" y="210" fill="#b4d6d5" font-size="25">Find the right path. Leave a better one.</text>
    <rect x="58" y="261" width="108" height="31" rx="15.5" fill="#123c3b" stroke="#2f7067"/>
    <text x="112" y="281" text-anchor="middle" fill="#b9f5e8" font-size="12" font-weight="700" letter-spacing="1">DIAGNOSE</text>
    <rect x="178" y="261" width="96" height="31" rx="15.5" fill="#123c3b" stroke="#2f7067"/>
    <text x="226" y="281" text-anchor="middle" fill="#b9f5e8" font-size="12" font-weight="700" letter-spacing="1">REPAIR</text>
    <rect x="286" y="261" width="96" height="31" rx="15.5" fill="#123c3b" stroke="#2f7067"/>
    <text x="334" y="281" text-anchor="middle" fill="#b9f5e8" font-size="12" font-weight="700" letter-spacing="1">VERIFY</text>
    <rect x="394" y="261" width="108" height="31" rx="15.5" fill="#123c3b" stroke="#2f7067"/>
    <text x="448" y="281" text-anchor="middle" fill="#b9f5e8" font-size="12" font-weight="700" letter-spacing="1">IMPROVE</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="2">
    <path d="M970 92H1060L1110 142H1215M970 92V216L1030 276H1150M1110 142V218H1242" opacity=".6"/>
